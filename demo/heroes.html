<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Hero Lab</title>
  <meta name="description" content="Seven ideas for the portfolio hero that are not a globe." />
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/x-icon" href="../assets/img/favicon.ico" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,200..800&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Martian+Mono:wght@400;500&family=Tiro+Bangla&display=swap" rel="stylesheet" />
  <script>
    // Same saved theme as the portfolio (light by default).
    (function () {
      var t = 'light';
      try {
        var s = localStorage.getItem('v3-theme');
        if (s === 'light' || s === 'dark' || s === 'claude') t = s;
      } catch (e) {}
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <style>
    /* Tokens copied from css/v3.css. */
    :root,
    :root[data-theme="light"] {
      --bg: #f2f5f1; --bg-alt: #e7ede7; --surface: #fafbf9;
      --line: rgba(31, 51, 44, 0.12); --line-strong: rgba(31, 51, 44, 0.24);
      --ink: #1f332c; --muted: #4d6158; --accent: #2c7360; --red: #c93c4a;
      --globe-disc-hi: #f1f6f2; --globe-disc-mid: #d8e6dc; --globe-disc-lo: #b5cbbd;
      --globe-glow: 44, 115, 96; --globe-dot: 34, 82, 64;
      --chip-bg: rgba(250, 251, 249, 0.95);
    }
    :root[data-theme="dark"] {
      --bg: #131a18; --bg-alt: #0f1513; --surface: #18221f;
      --line: rgba(226, 232, 228, 0.1); --line-strong: rgba(226, 232, 228, 0.22);
      --ink: #e2e8e4; --muted: #a3b3ab; --accent: #8fc6b0; --red: #ec6f78;
      --globe-disc-hi: #2c4038; --globe-disc-mid: #1d2c26; --globe-disc-lo: #111a17;
      --globe-glow: 143, 198, 176; --globe-dot: 143, 198, 176;
      --chip-bg: rgba(15, 21, 19, 0.92);
    }
    :root[data-theme="claude"] {
      --bg: #faf9f5; --bg-alt: #f0eee6; --surface: #ffffff;
      --line: rgba(31, 30, 29, 0.11); --line-strong: rgba(31, 30, 29, 0.22);
      --ink: #1f1e1d; --muted: #5e5d59; --accent: #a84e2d; --red: #d97757;
      --globe-disc-hi: #fffdf8; --globe-disc-mid: #f2eee4; --globe-disc-lo: #d9d1bf;
      --globe-glow: 217, 119, 87; --globe-dot: 61, 57, 50;
      --chip-bg: rgba(255, 255, 255, 0.95);
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font: 400 16px/1.55 "Instrument Sans", system-ui, sans-serif;
      transition: background-color 0.3s, color 0.3s;
    }
    button { font: inherit; color: inherit; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

    .top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 18px clamp(16px, 4vw, 48px) 10px; }
    .brand { display: inline-flex; align-items: center; gap: 10px; font: 650 18px/1 "Bricolage Grotesque", sans-serif; color: var(--ink); text-decoration: none; }
    .mark { width: 14px; height: 14px; border-radius: 50%; background: var(--red); box-shadow: 0 0 0 4px color-mix(in srgb, var(--red) 18%, transparent); }
    .pages { display: inline-flex; gap: 2px; padding: 3px; border: 1px solid var(--line-strong); border-radius: 999px; }
    .pages a { padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 500; color: var(--muted); text-decoration: none; }
    .pages a[aria-current="page"] { background: var(--ink); color: var(--bg); }
    .theme-switch { margin-left: auto; display: inline-flex; gap: 2px; padding: 3px; border: 1px solid var(--line-strong); border-radius: 999px; }
    .theme-switch button { border: 0; background: none; cursor: pointer; padding: 6px 12px; border-radius: 999px; font-size: 13px; font-weight: 500; color: var(--muted); }
    .theme-switch button[aria-checked="true"] { background: var(--ink); color: var(--bg); }

    .tabs { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 10px clamp(16px, 4vw, 48px) 18px; }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex: none; display: inline-flex; align-items: center; gap: 9px; padding: 7px 15px 7px 7px; cursor: pointer;
      border: 1px solid var(--line-strong); border-radius: 999px; background: transparent;
      font-size: 14px; font-weight: 500; white-space: nowrap; transition: background-color 0.2s, color 0.2s, border-color 0.2s;
    }
    .tab:hover { border-color: var(--ink); }
    .tab .n { display: grid; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: var(--bg-alt); font: 500 11px/1 "Martian Mono", monospace; }
    .tab[aria-selected="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
    .tab[aria-selected="true"] .n { background: var(--red); color: #fff; }

    .lab { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 0.85fr); gap: clamp(24px, 4vw, 64px); align-items: start; padding: 0 clamp(16px, 4vw, 48px) 56px; }
    @media (max-width: 900px) { .lab { grid-template-columns: minmax(0, 1fr); } }

    .stage {
      position: relative; width: 100%; aspect-ratio: 1 / 1; max-height: 80vh; border-radius: 28px; overflow: hidden; isolation: isolate;
      background: var(--bg); border: 1px solid var(--line); user-select: none; -webkit-user-select: none; transition: background-color 0.4s;
    }
    .stage canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .stage[data-variant="devices"] { background: radial-gradient(circle at 50% 40%, var(--surface) 0%, var(--bg-alt) 75%); }
    .stage[data-variant="skyline"] { background: linear-gradient(180deg, var(--bg-alt) 0%, var(--bg) 70%); }
    .stage[data-variant="terminal"] { background: var(--bg-alt); }
    .stage-dom { position: absolute; inset: 0; display: none; }
    .stage[data-mode="dom"] .stage-dom { display: block; }
    .stage[data-mode="dom"] canvas { visibility: hidden; }
    .stage-hint { position: absolute; left: 18px; bottom: 14px; margin: 0; pointer-events: none; font: 500 10px/1 "Martian Mono", monospace; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); opacity: 0.8; }
    .stage[data-mode="dom"] .stage-hint { display: none; }
    .stage-fallback { position: absolute; inset: 0; display: grid; place-items: center; margin: 0; padding: 24px; text-align: center; color: var(--muted); }
    .stage-fallback[hidden] { display: none; }

    /* Chips */
    .chips { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
    .chip {
      position: absolute; left: 0; top: 0; opacity: 0; display: flex; flex-direction: column; gap: 2px; padding: 6px 10px;
      border-radius: 10px; background: var(--chip-bg); color: var(--ink); box-shadow: 0 0 0 1px var(--line), 0 6px 18px rgba(0, 0, 0, 0.07);
      font: 600 12.5px/1.15 "Instrument Sans", sans-serif; white-space: nowrap; transition: opacity 0.3s, box-shadow 0.3s; will-change: transform;
    }
    .chip span { font: 500 9.5px/1.3 "Martian Mono", monospace; color: var(--muted); letter-spacing: 0.02em; }
    .chip span:empty { display: none; }
    .chip.is-active { box-shadow: 0 0 0 1.5px var(--red), 0 6px 18px rgba(0, 0, 0, 0.1); }
    .chip.is-small { padding: 4px 8px; border-radius: 8px; font-size: 11px; }
    .chip.is-small span { font-size: 8.5px; }
    .chip.is-plain { background: none; box-shadow: none; padding: 0; font: 500 10px/1 "Martian Mono", monospace; color: var(--muted); letter-spacing: 0.04em; }

    /* Terminal */
    .term {
      position: absolute; inset: 9% 6%; display: flex; flex-direction: column; overflow: hidden; border-radius: 14px;
      background: #0d1311; color: #d6e2dc; box-shadow: 0 30px 60px rgba(0, 0, 0, 0.22), 0 0 0 1px rgba(255, 255, 255, 0.06);
      font: 400 clamp(11px, 1.15vw, 13.5px)/1.7 "Martian Mono", monospace;
    }
    .term-bar { display: flex; align-items: center; gap: 7px; padding: 11px 14px; background: #151d1a; color: #7d8f87; font-size: 11px; }
    .term-bar i { width: 11px; height: 11px; border-radius: 50%; background: #3a4642; }
    .term-bar i:nth-child(1) { background: #ec6f78; }
    .term-bar i:nth-child(2) { background: #e7b75f; }
    .term-bar i:nth-child(3) { background: #6fcf97; }
    .term-bar span { margin-left: 10px; }
    .term-body { flex: 1; padding: 16px 18px; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-end; }
    .term-body p { margin: 0; white-space: pre-wrap; word-break: break-word; }
    .t-prompt { color: #8fc6b0; }
    .t-branch { color: #7d8f87; }
    .t-ok { color: #6fcf97; }
    .t-arrow { color: #ec6f78; }
    .t-muted { color: #7d8f87; }
    .t-cursor { display: inline-block; width: 0.6em; height: 1.1em; vertical-align: -0.2em; background: #d6e2dc; animation: blink 1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }

    /* Big type */
    .bigtype { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; padding: 0 8% 12%; overflow: hidden; }
    .bt-sun { position: absolute; width: 62%; aspect-ratio: 1; border-radius: 50%; background: var(--red); right: -14%; top: 8%; }
    .bt-small { position: relative; margin: 0 0 0.5em; font: 500 clamp(12px, 1.4vw, 15px) "Martian Mono", monospace; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
    .bt-word { position: relative; margin: 0; min-height: 2em; font: 760 clamp(40px, 6.6vw, 92px)/0.95 "Bricolage Grotesque", sans-serif; letter-spacing: -0.035em; color: var(--ink); }
    .bt-word .w { display: inline-block; white-space: nowrap; }
    .bt-word .l { display: inline-block; animation: rise 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both; }
    @keyframes rise { from { transform: translateY(0.55em) rotate(5deg); opacity: 0; } to { transform: none; opacity: 1; } }
    .bt-tail { position: relative; margin: 0.9em 0 0; max-width: 24ch; font: 500 clamp(15px, 1.7vw, 20px)/1.4 "Instrument Sans", sans-serif; color: var(--ink); }
    .bt-marquee { position: absolute; left: 0; right: 0; bottom: 7%; overflow: hidden; white-space: nowrap; padding: 11px 0; border-block: 1px solid var(--line-strong); font: 500 12.5px/1 "Martian Mono", monospace; color: var(--muted); }
    .bt-marquee div { display: inline-block; animation: marquee 34s linear infinite; }
    @keyframes marquee { to { transform: translateX(-50%); } }

    /* Tour caption */
    .tour { margin-top: 18px; border-top: 1px solid var(--line-strong); padding-top: 12px; }
    .tour-head { display: flex; justify-content: space-between; gap: 12px; font: 500 11px/1.4 "Martian Mono", monospace; letter-spacing: 0.06em; text-transform: uppercase; color: var(--accent); }
    .tour-title { margin: 8px 0 2px; font: 650 clamp(20px, 2.4vw, 26px)/1.15 "Bricolage Grotesque", sans-serif; }
    .tour-sub { margin: 0; color: var(--muted); min-height: 1.55em; }
    .tour-text.is-swapping { animation: swap 0.5s ease; }
    @keyframes swap { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
    .tour-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 14px; }
    .ticks { display: flex; gap: 6px; }
    .ticks button { position: relative; width: 26px; height: 22px; border: 0; padding: 0; background: none; cursor: pointer; }
    .ticks button::after { content: ""; position: absolute; left: 0; right: 0; top: 50%; height: 2px; border-radius: 2px; background: var(--line-strong); transition: background-color 0.2s; }
    .ticks button[aria-current="true"]::after { background: var(--red); }
    .tour-buttons { display: flex; gap: 6px; }
    .tour-buttons button { display: grid; place-items: center; width: 38px; height: 38px; cursor: pointer; border: 1px solid var(--line-strong); border-radius: 50%; background: transparent; }
    .tour-buttons button:hover { border-color: var(--ink); }
    .tour-buttons svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
    [data-toggle] .i-play { display: none; }
    [data-toggle][aria-pressed="true"] .i-play { display: block; }
    [data-toggle][aria-pressed="true"] .i-pause { display: none; }

    /* Info panel */
    .info { position: sticky; top: 20px; }
    .eyebrow { margin: 0 0 10px; color: var(--accent); font: 500 11px/1.4 "Martian Mono", monospace; letter-spacing: 0.08em; text-transform: uppercase; }
    .info h1 { margin: 0; font: 700 clamp(38px, 5vw, 66px)/0.98 "Bricolage Grotesque", sans-serif; letter-spacing: -0.025em; }
    .badge { display: inline-block; margin-left: 12px; vertical-align: 0.55em; padding: 5px 9px; border-radius: 999px; background: var(--accent); color: var(--bg); font: 500 10px/1 "Martian Mono", monospace; letter-spacing: 0.06em; text-transform: uppercase; }
    .line { margin: 16px 0 10px; font: 500 19px/1.4 "Instrument Sans", sans-serif; }
    .desc { margin: 0 0 22px; color: var(--muted); max-width: 54ch; }
    .facts { display: grid; grid-template-columns: auto 1fr; gap: 9px 20px; margin: 0 0 22px; padding: 16px 0; border-block: 1px solid var(--line); }
    .facts dt { padding-top: 3px; color: var(--muted); font: 500 10.5px/1.4 "Martian Mono", monospace; letter-spacing: 0.06em; text-transform: uppercase; }
    .facts dd { margin: 0; font-weight: 500; }
    .set-label { margin: 0 0 8px; color: var(--muted); font: 500 10.5px/1.4 "Martian Mono", monospace; letter-spacing: 0.06em; text-transform: uppercase; }
    .seg { display: inline-flex; padding: 3px; border: 1px solid var(--line-strong); border-radius: 999px; }
    .seg button { border: 0; background: none; cursor: pointer; padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 500; }
    .seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
    .keys { margin: 22px 0 0; color: var(--muted); font: 500 11px/1.8 "Martian Mono", monospace; }
    kbd { padding: 1px 6px; border: 1px solid var(--line-strong); border-radius: 5px; font: inherit; }

    @media (max-width: 900px) { .info { position: static; } }
    @media (prefers-reduced-motion: reduce) {
      .tour-text.is-swapping, .bt-word .l, .bt-marquee div, .t-cursor { animation: none; }
    }
  </style>
</head>
<body>
  <header class="top">
    <a class="brand" href="../index.html"><span class="mark" aria-hidden="true"></span>Hero lab</a>
    <nav class="pages" aria-label="Demos">
      <a href="globes.html">Globe variants</a>
      <a href="heroes.html" aria-current="page">Beyond the globe</a>
      <a href="backgrounds.html">Backgrounds</a>
    </nav>
    <div class="theme-switch" role="radiogroup" aria-label="Colour theme">
      <button type="button" role="radio" aria-checked="false" data-theme-value="light">Light</button>
      <button type="button" role="radio" aria-checked="false" data-theme-value="dark">Dark</button>
      <button type="button" role="radio" aria-checked="false" data-theme-value="claude">Claude</button>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="Hero ideas" data-tabs></nav>

  <main class="lab">
    <section aria-label="Preview">
      <div class="stage" data-stage data-variant="system" data-mode="3d">
        <canvas data-canvas aria-hidden="true"></canvas>
        <div class="stage-dom" data-dom></div>
        <div class="chips" data-chips aria-hidden="true"></div>
        <p class="stage-hint" data-hint>Move the cursor over it</p>
        <p class="stage-fallback" data-fallback hidden>This browser could not start WebGL, so the 3D previews can't run here.</p>
      </div>

      <div class="tour">
        <div class="tour-head"><span data-route></span><span data-count>1 / 1</span></div>
        <div class="tour-text" data-tour-text>
          <p class="tour-title" data-title></p>
          <p class="tour-sub" data-sub></p>
        </div>
        <div class="tour-foot">
          <div class="ticks" role="group" aria-label="Tour steps" data-ticks></div>
          <div class="tour-buttons">
            <button type="button" data-prev aria-label="Previous step"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5" /></svg></button>
            <button type="button" data-toggle aria-pressed="false" aria-label="Pause tour">
              <svg class="i-pause" viewBox="0 0 16 16" aria-hidden="true"><path d="M5.5 3.5v9M10.5 3.5v9" /></svg>
              <svg class="i-play" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 3.5v9l7-4.5z" /></svg>
            </button>
            <button type="button" data-next aria-label="Next step"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5" /></svg></button>
          </div>
        </div>
      </div>
    </section>

    <aside class="info">
      <p class="eyebrow" data-eyebrow>Idea 01 / 07</p>
      <h1><span data-name></span><span class="badge" data-badge></span></h1>
      <p class="line" data-line></p>
      <p class="desc" data-desc></p>
      <dl class="facts">
        <dt>Suits</dt><dd data-suits></dd>
        <dt>Effort</dt><dd data-effort></dd>
        <dt>Weight</dt><dd data-weight></dd>
        <dt>Colours</dt><dd data-themed></dd>
      </dl>
      <p class="set-label">Content</p>
      <div class="seg" role="group" aria-label="Content set" data-set>
        <button type="button" data-set-value="full" aria-pressed="true">Full site</button>
        <button type="button" data-set-value="pro" aria-pressed="false">Pro build</button>
      </div>
      <p class="keys"><kbd>1</kbd>–<kbd>7</kbd> switch idea · <kbd>←</kbd> <kbd>→</kbd> tour steps</p>
    </aside>
  </main>

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.min.js';

    THREE.ColorManagement.enabled = false;
    const V3 = THREE.Vector3, C = THREE.Color;
    const DEG = Math.PI / 180, TAU = Math.PI * 2;
    const Z = new V3(0, 0, 1);
    const MOTION = !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);

    /* ======================================================================
       Data

        out.push({ x: ((i + 0.5) / N) * 2 - 1, y: 1 - ((j + 0.5) / N) * 2, s: 0.0225 * Math.sqrt(d) });

    /* ======================================================================
       4. Career skyline
       ====================================================================== */
    const DISTRICTS = [
      { name: 'GTRBD Ltd.', years: 'Oct 2018 – Feb 2019', role: 'Junior Software Engineer', a: 2018.75, b: 2019.13, heights: [0.32], projects: ['Garments HR & payroll'] },
      { name: 'SmartSoft Technology', years: 'Mar 2019 – Sep 2020', role: 'Junior Software Engineer', a: 2019.17, b: 2020.71, heights: [0.42, 0.5, 0.58], projects: ['Factory ERP', 'Task & workflow', 'Smart Sell POS'] },
      { name: 'Bizzntek Ltd.', years: 'Oct 2020 – now', role: 'Senior Software Engineer', a: 2020.75, b: 2026.8, heights: [0.72, 0.86, 1.0, 1.16], projects: ['Business Central localization', 'PIRAMIDS', 'GoGlobal platform', 'Western Digital CIO app'] },
      { name: 'Independent products', years: 'Alongside · live today', role: 'Full-stack & mobile', a: 2022.9, b: 2026.6, z: -0.82, heights: [0.5, 0.42, 0.58, 0.46, 0.38], projects: ['MapCars UK', 'Motorshut', 'AykorGPT', 'VetMart BD', 'Cumilla Resort'], personal: true }
    ];
    function buildSkyline(S) {
      const P = S.pal, scene = new THREE.Scene(), world = new THREE.Group();
      scene.add(world);
      const X = yr => (yr - 2022.8) * 0.42;
      const districts = DISTRICTS.filter(d => S.full || !d.personal);
      const back = S.full ? -1.15 : -0.5;
      const ground = new THREE.Mesh(new THREE.BoxGeometry(X(2027.1) - X(2018.45), 0.03, 0.55 - back), new THREE.MeshBasicMaterial({ color: mix(P.bg, P.dot, 0.06) }));
      ground.position.set((X(2027.1) + X(2018.45)) / 2, -0.015, (0.55 + back) / 2);
      world.add(ground);
      const axis = new THREE.Mesh(new THREE.BoxGeometry(X(2027.1) - X(2018.45), 0.004, 0.006), new THREE.MeshBasicMaterial({ color: P.dot, transparent: true, opacity: 0.5 }));
      axis.position.set(ground.position.x, 0.002, 0.5);
      world.add(axis);
      const years = [];
      for (let y = 2019; y <= 2026; y++) {
        const tick = new THREE.Mesh(new THREE.BoxGeometry(0.006, 0.006, 0.06), new THREE.MeshBasicMaterial({ color: P.dot }));
        tick.position.set(X(y), 0.003, 0.5);
        world.add(tick);
        years.push({ y, pos: new V3(X(y), 0, 0.56) });
      }
      const towers = [];
      const state = districts.map((d, di) => {
        const x0 = X(d.a), x1 = X(d.b), w = Math.max(0.16, x1 - x0), cx = (x0 + x1) / 2, z0 = d.z || 0;
        const pad = new THREE.Mesh(new THREE.BoxGeometry(w, 0.02, 0.62), new THREE.MeshBasicMaterial({ color: mix(P.bg, P.dot, 0.14) }));
        pad.position.set(cx, 0.01, z0);
        world.add(pad);
        const n = d.projects.length, f = Math.min(0.13, (w / n) * 0.6);
        const list = d.projects.map((name, k) => {
          const h = d.heights[k], x = n === 1 ? cx : x0 + (w * 0.12) + ((w * 0.76) * k) / (n - 1);
          const z = z0 + (n > 2 ? (k % 2 ? -0.12 : 0.1) : 0);
          const geo = new THREE.BoxGeometry(f, h, f);
          geo.translate(0, h / 2, 0);
          const mat = new THREE.ShaderMaterial({
            uniforms: {
              uBaseA: { value: mix(P.bg, P.dot, 0.32) }, uTopA: { value: mix(P.bg, P.dot, 0.18) },
              uBaseB: { value: P.dot.clone() }, uTopB: { value: mix(P.dot, P.accent, 0.5) },
              uWin: { value: P.dark ? P.hi.clone().lerp(new C(1, 1, 1), 0.4) : P.bg.clone() }, uH: { value: h }, uOn: { value: 0 }
            },
            vertexShader: TOWER_VS, fragmentShader: TOWER_FS
          });
          const m = new THREE.Mesh(geo, mat);
          m.position.set(x, 0.02, z);
          m.scale.y = MOTION ? 0.001 : 1;
          world.add(m);
          const t = { m, mat, h, name, d: di, born: performance.now() + 300 + towers.length * 140 };
          towers.push(t);
          return t;
        });
        return { d, cx, w, z0, towers: list };
      });
      const beats = districts.map(d => ({ label: d.years, title: d.name, sub: `${d.role} · ${d.projects.join(', ')}` }));
      beats.push({ label: '2018 – now', title: 'The whole street', sub: `${towers.length} projects across ${districts.length} districts` });
      // The street runs diagonally: 2018 in front on the left, rising to today at the back right.
      world.rotation.y = 0.7;
      world.position.x = -(X(2018.45) + X(2027.1)) / 2 * Math.cos(0.7);
      world.updateMatrixWorld();
      const centre = new V3(0, 0.3, 0);
      let active = 0, dist = 6, targetDist = 6;
      const look = centre.clone(), targetLook = centre.clone();
      const distFor = () => fitDistance(active >= 0 ? 1.5 : 1.75);
      return {
        scene, beats,
        onResize() { targetDist = distFor(); },
        setBeat(i) {
          active = i < state.length ? i : -1;
          // Drift part of the way toward the active district; the overview frames the whole street.
          targetLook.copy(centre);
          if (active >= 0) targetLook.lerp(new V3(state[active].cx, 0.3, state[active].z0).applyMatrix4(world.matrixWorld), 0.3);
          targetDist = distFor();
        },
        update(now, dt) {
          const e = Math.min(1, dt * 0.0025);
          look.lerp(targetLook, e);
          dist += (targetDist - dist) * e;
          camera.position.set(look.x + MOUSE.x * 0.4, look.y + dist * 0.55 + MOUSE.y * 0.2, look.z + dist * 0.84);
          camera.lookAt(look);
          towers.forEach(t => {
            if (MOTION) t.m.scale.y = Math.max(0.001, easeOut((now - t.born) / 900));
            const on = active < 0 || t.d === active ? 1 : 0;
            t.mat.uniforms.uOn.value += (on - t.mat.uniforms.uOn.value) * Math.min(1, dt * 0.005);
          });
        },
        labels() {
          const m = world.matrixWorld;
          const out = years.map(y => ({ id: `y${y.y}`, world: y.pos.clone().applyMatrix4(m), title: String(y.y), sub: '', plain: true, place: 'below', gap: 2, opacity: 1 }));
          const shown = active >= 0 ? state[active].towers : [];
          shown.forEach((t, k) => out.push({ id: `t${active}-${k}`, world: new V3(t.m.position.x, t.h + 0.05, t.m.position.z).applyMatrix4(m), title: t.name, sub: '', small: true, place: 'above', gap: 6, opacity: clamp(t.m.scale.y * 1.2 - 0.2, 0, 1) }));
          return out;
        }
      };
    }

    /* ======================================================================
       5. River delta
       ====================================================================== */
    function buildDelta(S) {
      const P = S.pal, scene = new THREE.Scene(), plane = new THREE.Group();
      plane.rotation.x = -0.62;
      scene.add(plane);
      const RIVERS = [
        { name: 'Padma', stream: 'Enterprise & ERP', note: 'C# · ASP.NET · Business Central · since 2018', pts: [[-1.25, 0.6], [-0.98, 0.56], [-0.74, 0.4], [-0.46, 0.34], [-0.22, 0.18], [0, 0.05]] },
        { name: 'Jamuna', stream: 'Mobile apps', note: 'Flutter · Android & iOS · Firebase', pts: [[-0.12, 1.22], [-0.02, 0.98], [-0.16, 0.72], [-0.03, 0.46], [-0.06, 0.22], [0, 0.05]] },
        { name: 'Meghna', stream: 'Cloud & data', note: 'SQL Server · AWS · Google Cloud', pts: [[1.18, 0.98], [0.9, 0.82], [0.74, 0.56], [0.44, 0.42], [0.24, 0.2], [0, 0.05]] }
      ];
      const MAIN = [[0, 0.05], [0.05, -0.13], [0.0, -0.3], [0.02, -0.44]];
      const ND = 7, DIST = [];
      for (let j = 0; j < ND; j++) {
        const ex = -0.98 + (j * 1.96) / (ND - 1), w = j % 2 ? 0.05 : -0.05;
        DIST.push([[0.02, -0.44], [ex * 0.32 + w, -0.6], [ex * 0.72 - w, -0.82], [ex, -1.04]]);
      }
      const toCurve = arr => new THREE.CatmullRomCurve3(arr.map(([x, y]) => new V3(x, y, 0)), false, 'centripetal');
      const SAMPLES = 360;
      const paths = [];
      RIVERS.forEach((rv, r) => DIST.forEach(dj => {
        const curve = toCurve(rv.pts.concat(MAIN.slice(1), dj.slice(1)));
        const sp = curve.getSpacedPoints(SAMPLES);
        paths.push({ r, xs: Float32Array.from(sp, p => p.x), ys: Float32Array.from(sp, p => p.y) });
      }));
      // River beds.
      const bed = (arr, radius, opacity) => {
        const m = new THREE.Mesh(new THREE.TubeGeometry(toCurve(arr), 120, radius, 6, false), new THREE.MeshBasicMaterial({ color: P.dot, transparent: true, opacity, depthWrite: false }));
        m.scale.z = 0.05;
        plane.add(m);
      };
      RIVERS.forEach(rv => bed(rv.pts, 0.02, 0.1));
      bed(MAIN, 0.04, 0.12);
      DIST.forEach(d => bed(d, 0.018, 0.08));
      // Fields and sea.
      const field = [];
      for (let y = 1.3; y > -1.0; y -= 0.07) for (let x = -1.4; x <= 1.4; x += 0.07) field.push({ p: new V3(x + (hash(x, y) - 0.5) * 0.02, y, -0.004), c: P.dot, s: 0.008, a: 0.12 });
      for (let y = -1.08, k = 0; y > -1.5; y -= 0.05, k++) for (let x = -1.5; x <= 1.5; x += 0.045) field.push({ p: new V3(x, y + Math.sin(x * 9 + k) * 0.012, -0.004), c: P.accent, s: 0.01, a: 0.28 });
      plane.add(pts(field));
      // Flowing particles.
      const PER = 900, total = PER * RIVERS.length, r = rng(9);
      const parts = [];
      for (let i = 0; i < total; i++) {
        const rv = Math.floor(i / PER);
        parts.push({ rv, path: rv * ND + Math.floor(r() * ND), t: r(), speed: 0.045 + r() * 0.03, off: (r() * 2 - 1), s: 0.011 + r() * 0.008 });
      }
      const items = parts.map(p => ({ p: new V3(), c: P.dot, s: p.s, a: 0.8 }));
      const flow = pts(items, { dynamic: true });
      plane.add(flow);
      const posA = flow.geometry.getAttribute('position'), colA = flow.geometry.getAttribute('aColor'), alA = flow.geometry.getAttribute('aAlpha');
      const DHAKA = new V3(0, 0.05, 0.006);
      disc(plane, DHAKA, 0.022, P.red);
      const dPulse = pulse(plane, DHAKA, P.red, { size: 0.16, alpha: 0.6 });
      const beats = [
        ...RIVERS.map(rv => ({ label: `${rv.name} · ${rv.stream}`, title: rv.stream, sub: rv.note })),
        { label: 'Confluence', title: 'They meet in Dhaka', sub: 'One engineer, end to end: back end, mobile, cloud and data.' },
        { label: 'Bay of Bengal', title: 'Out to the world', sub: S.full ? 'Shipped for clients in the USA, the UK and Bangladesh.' : 'Shipped for clients in the USA and Bangladesh.' }
      ];
      let active = 0;
      function recolor() {
        const hot = P.red, base = P.dot;
        parts.forEach((p, i) => {
          const on = active < 3 ? p.rv === active : true;
          const c = active < 3 ? (on ? hot : base) : active === 3 ? base : P.accent;
          colA.setXYZ(i, c.r, c.g, c.b);
        });
        colA.needsUpdate = true;
      }
      return {
        scene, beats,
        onResize() { camera.position.set(0, 0, fitDistance(1.32)); camera.lookAt(0, 0, 0); },
        setBeat(i) { active = i; recolor(); dPulse.size = i === 3 ? 0.3 : 0.16; },
        update(now, dt) {
          plane.rotation.z = MOUSE.x * 0.05;
          plane.rotation.x = -0.62 + MOUSE.y * 0.05;
          const step = MOTION ? dt / 1000 : 0;
          parts.forEach((p, i) => {
            p.t += p.speed * step;
            if (p.t >= 1) { p.t -= 1; p.path = p.rv * ND + Math.floor(Math.random() * ND); }
            const path = paths[p.path], f = p.t * SAMPLES, i0 = Math.min(SAMPLES - 1, Math.floor(f)), fr = f - i0;
            const x0 = path.xs[i0], y0 = path.ys[i0], x1 = path.xs[i0 + 1], y1 = path.ys[i0 + 1];
            let tx = x1 - x0, ty = y1 - y0;
            const len = Math.hypot(tx, ty) || 1;
            tx /= len; ty /= len;
            const w = 0.012 + 0.03 * clamp((p.t - 0.35) / 0.4, 0, 1);
            posA.setXYZ(i, x0 + (x1 - x0) * fr - ty * p.off * w, y0 + (y1 - y0) * fr + tx * p.off * w, 0.004);
            const on = active < 3 ? p.rv === active : true;
            alA.setX(i, (on ? 0.95 : 0.35) * Math.min(1, p.t * 12) * Math.min(1, (1 - p.t) * 10));
          });
          posA.needsUpdate = true;
          alA.needsUpdate = true;
          dPulse.update(now);
        },
        labels() {
          const m = plane.matrixWorld, out = RIVERS.map((rv, i) => ({
            id: rv.name, world: new V3(rv.pts[0][0], rv.pts[0][1], 0).applyMatrix4(m), title: rv.name, sub: rv.stream,
            active: active === i, opacity: active < 3 && active !== i ? 0.6 : 1, place: i === 1 ? 'above' : 'below', gap: 8
          }));
          out.push({ id: 'dhaka', world: DHAKA.clone().applyMatrix4(m), title: 'Dhaka', sub: 'confluence', active: active === 3, opacity: 1 });
          out.push({ id: 'bay', world: new V3(0, -1.16, 0).applyMatrix4(m), title: 'Bay of Bengal', sub: S.full ? 'USA · UK · BD' : 'USA · BD', active: active === 4, opacity: 1, place: 'above', gap: 0 });
          return out;
        }
      };
    }

    function buildTerminal() {
      const el = document.createElement('div');
      el.className = 'term';
      el.innerHTML = '<div class="term-bar"><i></i><i></i><i></i><span>mahfuz@dhaka</span></div><div class="term-body" data-term></div>';
      const body = el.querySelector('[data-term]');
      let queue = [], line = null, lineEl = null, chars = 0, wait = 0, last = 0, cursor = null;
      const esc = s => s.replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
      function addCursor() { if (cursor) cursor.remove(); cursor = document.createElement('span'); cursor.className = 't-cursor'; (lineEl || body).appendChild(cursor); }
      function promptHtml(b) { return `<span class="t-prompt">${esc(b.dir)}</span> <span class="t-branch">(${esc(b.branch)})</span> $ `; }
      let beat = null;
      return {
        dom: el, beats: TERM_BEATS, dwell: 8500,
        setBeat(i, now) {
          beat = TERM_BEATS[i];
          body.textContent = '';
          queue = beat.lines.slice();
          line = null; lineEl = null; wait = now + 300; last = now;
          if (!MOTION) {
            queue.forEach(([kind, text]) => {
              const p = document.createElement('p');
              p.innerHTML = kind === 'cmd' ? promptHtml(beat) + esc(text) : `<span class="t-${kind === 'ok' ? 'ok' : kind === 'arrow' ? 'arrow' : 'muted'}">${esc(text)}</span>`;
              body.appendChild(p);
            });
            queue = [];
          }
          addCursor();
        },
        update(now) {
          if (!beat || now < wait) return;
          if (!line) {
            if (!queue.length) {
              if (!lineEl || lineEl.dataset.prompt !== '1') {
                lineEl = document.createElement('p'); lineEl.dataset.prompt = '1'; lineEl.innerHTML = promptHtml(beat); body.appendChild(lineEl); addCursor();
              }
              return;
            }
            line = queue.shift();
            lineEl = document.createElement('p');
            body.appendChild(lineEl);
            if (line[0] === 'cmd') { lineEl.innerHTML = promptHtml(beat) + '<span data-typed></span>'; chars = 0; addCursor(); }
            else {
              lineEl.innerHTML = `<span class="t-${line[0] === 'ok' ? 'ok' : line[0] === 'arrow' ? 'arrow' : 'muted'}">${esc(line[1])}</span>`;
              line = null; wait = now + 260; addCursor();
            }
            last = now;
            return;
          }
          const add = Math.floor((now - last) / 32);
          if (add > 0) {
            chars = Math.min(line[1].length, chars + add); last = now;
            lineEl.querySelector('[data-typed]').textContent = line[1].slice(0, chars);
            addCursor();
            if (chars >= line[1].length) { line = null; wait = now + 520; }
          }
        }
      };
    }

    const chipMap = new Map();

          chipMap.set(it.id, el);
        }
        if (el._t !== it.title) { el.firstChild.textContent = it.title; el._t = it.title; }
        if (el._s !== it.sub) { el.lastChild.textContent = it.sub || ''; el._s = it.sub; }
        el.classList.toggle('is-active', !!it.active);
        el.classList.toggle('is-small', !!it.small);
        el.classList.toggle('is-plain', !!it.plain);
        const v = it.world.clone().project(camera);
        const off = Math.abs(v.x) > 1.02 || Math.abs(v.y) > 1.02 || v.z > 1;
        const x = (v.x * 0.5 + 0.5) * w, y = (-v.y * 0.5 + 0.5) * h;
        const ew = el.offsetWidth, eh = el.offsetHeight, gap = it.gap ?? 10;
        let cx, cy;
        if (it.place === 'below') { cx = x - ew / 2; cy = y + gap; }
        else if (it.place === 'above') { cx = x - ew / 2; cy = y - eh - gap; }
        else {
          let right = x >= w * 0.5;
          if (right && x + 12 + ew > w - 8) right = false;
          else if (!right && x - 12 - ew < 8) right = true;
          cx = right ? x + 12 : x - 12 - ew;
          cy = y - eh - 8;
        }
        cx = clamp(cx, 8, w - ew - 8);
        cy = clamp(cy, 8, h - eh - 8);
        el.style.transform = `translate(${cx.toFixed(1)}px, ${cy.toFixed(1)}px)`;
        el.style.opacity = off ? 0 : clamp(it.opacity ?? 1, 0, 1).toFixed(2);
      });
      chipMap.forEach((el, id) => { if (!seen.has(id)) el.style.opacity = 0; });
    }

    /* ======================================================================
       Tour, variants, UI
       ====================================================================== */
    let SET = 'full', VI = 0, V = null;
    const tour = { i: 0, nextAt: 0, holdUntil: 0, paused: !MOTION };
    const ui = {
      route: $('[data-route]'), count: $('[data-count]'), title: $('[data-title]'), sub: $('[data-sub]'),
      text: $('[data-tour-text]'), ticks: $('[data-ticks]'), toggle: $('[data-toggle]'), tabs: $('[data-tabs]'), hint: $('[data-hint]')
    };

    function go(k, now) {
      if (!V) return;
      const beats = V.beats;
      tour.i = (k + beats.length) % beats.length;
      const b = beats[tour.i];
      V.setBeat(tour.i, now);
      ui.route.textContent = b.label;
      ui.count.textContent = `${tour.i + 1} / ${beats.length}`;
      ui.title.textContent = b.title;
      ui.sub.textContent = b.sub;
      [...ui.ticks.children].forEach((t, j) => (j === tour.i ? t.setAttribute('aria-current', 'true') : t.removeAttribute('aria-current')));
      if (MOTION) { ui.text.classList.remove('is-swapping'); void ui.text.offsetWidth; ui.text.classList.add('is-swapping'); }
      tour.nextAt = now + (V.dwell || 6500);
    }
    const hold = ms => { tour.holdUntil = performance.now() + ms; };
    function buildTicks() {
      ui.ticks.textContent = '';
      V.beats.forEach((b, k) => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.setAttribute('aria-label', `Show ${b.title}`);
        btn.addEventListener('click', () => { go(k, performance.now()); hold(9000); });
        ui.ticks.appendChild(btn);
      });
    }
    function setPaused(p) {
      tour.paused = p;
      ui.toggle.setAttribute('aria-pressed', String(p));
      ui.toggle.setAttribute('aria-label', p ? 'Play tour' : 'Pause tour');
      if (!p) tour.nextAt = Math.min(tour.nextAt, performance.now() + 1200);
    }

    VARIANTS.forEach((d, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'tab'; b.setAttribute('role', 'tab');
      b.innerHTML = `<span class="n">${i + 1}</span>`;
      b.append(d.name);
      b.addEventListener('click', () => useVariant(i));
      ui.tabs.appendChild(b);
    });

    function renderInfo() {
      const d = VARIANTS[VI];
      $('[data-eyebrow]').textContent = `Idea ${String(VI + 1).padStart(2, '0')} / ${String(VARIANTS.length).padStart(2, '0')}`;
      $('[data-name]').textContent = d.name;
      $('[data-badge]').textContent = d.key === 'terminal' || d.key === 'type' ? 'No 3D' : 'Three.js';
      $('[data-line]').textContent = d.line;
      $('[data-desc]').textContent = d.desc;
      $('[data-suits]').textContent = d.suits;
      $('[data-effort]').textContent = d.effort;
      $('[data-weight]').textContent = d.weight;
      $('[data-themed]').textContent = d.themed ? 'Follows the Light / Dark / Claude theme' : 'Own palette, same in every theme';
      [...ui.tabs.children].forEach((t, j) => { t.setAttribute('aria-selected', String(j === VI)); t.tabIndex = j === VI ? 0 : -1; });
      ui.tabs.children[VI].scrollIntoView({ block: 'nearest', inline: 'nearest' });
      ui.hint.textContent = { system: 'Move the cursor to tilt', devices: 'Move the cursor to turn', portrait: 'Move the cursor through the dots', skyline: 'Move the cursor to look around', delta: 'Move the cursor to tilt' }[d.key] || '';
    }

    function disposeScene(scene) {
      scene.traverse(o => {
        if (o.geometry) o.geometry.dispose();
        const mats = o.material ? (Array.isArray(o.material) ? o.material : [o.material]) : [];
        mats.forEach(m => { if (m.map) m.map.dispose(); m.dispose(); });
      });
    }

    function useVariant(i) {
      VI = (i + VARIANTS.length) % VARIANTS.length;
      const d = VARIANTS[VI];
      stage.dataset.variant = d.key;
      renderInfo();
      try { history.replaceState(null, '', `${location.search}#${d.key}`); } catch (e) {}
      if (V && V.scene) disposeScene(V.scene);
      domEl.textContent = '';
      clearChips();
      const isDom = d.key === 'terminal' || d.key === 'type';
      if (!isDom && !renderer) {
        $('[data-fallback]').hidden = false;
        V = { beats: [{ label: '', title: d.name, sub: 'Needs WebGL.' }], setBeat() {}, update() {} };
      } else {
        $('[data-fallback]').hidden = true;
        V = BUILDERS[d.key]({ full: SET === 'full', pal: palette() });
      }
      stage.dataset.mode = V.dom ? 'dom' : '3d';
      if (V.dom) domEl.appendChild(V.dom);
      camera.up.set(0, 1, 0);
      camera.position.set(0, 0, 4.2);
      camera.lookAt(0, 0, 0);
      resize();
      buildTicks();
      go(0, performance.now());
    }

    function resize() {
      const w = Math.max(1, stage.clientWidth), h = Math.max(1, stage.clientHeight);
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      if (renderer) {
        renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
        renderer.setSize(w, h, false);
        U.uScale.value = renderer.getDrawingBufferSize(new THREE.Vector2()).y / (2 * TAN);
      }
      if (V && V.onResize) V.onResize(camera.aspect);
    }
    new ResizeObserver(resize).observe(stage);

    const themeButtons = [...document.querySelectorAll('[data-theme-value]')];
    function markTheme() {
      const t = document.documentElement.getAttribute('data-theme');
      themeButtons.forEach(b => b.setAttribute('aria-checked', String(b.dataset.themeValue === t)));
    }
    themeButtons.forEach(b => b.addEventListener('click', () => {
      document.documentElement.setAttribute('data-theme', b.dataset.themeValue);
      try { localStorage.setItem('v3-theme', b.dataset.themeValue); } catch (e) {}
      markTheme();
      if (VARIANTS[VI].themed && !V.dom) useVariant(VI);
    }));
    markTheme();

    document.querySelectorAll('[data-set-value]').forEach(b => b.addEventListener('click', () => {
      SET = b.dataset.setValue;
      document.querySelectorAll('[data-set-value]').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
      useVariant(VI);
    }));
    $('[data-prev]').addEventListener('click', () => { go(tour.i - 1, performance.now()); hold(9000); });
    $('[data-next]').addEventListener('click', () => { go(tour.i + 1, performance.now()); hold(9000); });
    ui.toggle.addEventListener('click', () => setPaused(!tour.paused));
    document.addEventListener('keydown', e => {
      if (e.target.closest && e.target.closest('input, textarea')) return;
      if (e.key.length === 1 && e.key >= '1' && e.key <= String(VARIANTS.length)) useVariant(+e.key - 1);
      else if (e.key === 'ArrowRight') { go(tour.i + 1, performance.now()); hold(9000); }
      else if (e.key === 'ArrowLeft') { go(tour.i - 1, performance.now()); hold(9000); }
    });

    /* ======================================================================
       Start
       ====================================================================== */
    if (new URLSearchParams(location.search).get('set') === 'pro') {
      SET = 'pro';
      document.querySelectorAll('[data-set-value]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.setValue === 'pro')));
    }
    // Canvas text (screens, the name morph) needs the web fonts loaded first.
    await Promise.race([document.fonts.ready, new Promise(r => setTimeout(r, 2000))]);
    setPaused(!MOTION);
    const fromHash = VARIANTS.findIndex(v => `#${v.key}` === location.hash);
    useVariant(fromHash >= 0 ? fromHash : 0);

    let last = performance.now();
    function frame(now) {
      // The first rAF timestamp can be earlier than performance.now(), so never step backwards.
      const dt = clamp(now - last, 0, 64);
      last = now;
      const e = Math.min(1, dt * 0.004);
      MOUSE.x += (MOUSE.tx - MOUSE.x) * e;
      MOUSE.y += (MOUSE.ty - MOUSE.y) * e;
      U.uTime.value = now / 1000;
      if (V) {
        if (!tour.paused && now >= tour.nextAt && now >= tour.holdUntil) go(tour.i + 1, now);
        V.update(now, dt);
        if (V.scene && renderer) {
          V.scene.updateMatrixWorld();
          renderer.render(V.scene, camera);
          renderChips(V.labels ? V.labels(now) : []);
        }
      }
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  </script>
</body>
</html>
